name: seal-build

# Authored for the sealed build: upstream spring-cloud-config 2.2.x has no
# GitHub Actions CI (it builds on CircleCI, .circleci/config.yml, which runs
# `./mvnw -s .settings.xml clean install` on JDK 8). This workflow translates
# that job: JDK 8, the repo's Maven wrapper (3.5.0), full-reactor
# `clean install` with checkstyle / spring-javaformat left ON.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      _JAVA_OPTIONS: "-Xms1024m -Xmx2048m"
      TERM: dumb
      MVN_FLAGS: >-
        -B -e -V -nsu
        -Dmaven.test.redirectTestOutputToFile=true
        -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        -Dmaven.javadoc.skip=true -Dgpg.skip=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Drop the repo.spring.io profile (dead/authenticated repos; Maven Central has everything)
        run: |
          cat .mvn/maven.config
          : > .mvn/maven.config

      - name: Build and test (clean install, full reactor)
        run: |
          set -euxo pipefail
          java -version
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw $MVN_FLAGS clean install \
              -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false \
              -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw $MVN_FLAGS clean install
          fi

      - name: Stage release jars
        run: |
          set -euxo pipefail
          mkdir -p seal-out
          cp spring-cloud-config-server/target/spring-cloud-config-server-2.2.6.RELEASE.jar seal-out/
          cp spring-cloud-config-server/target/spring-cloud-config-server-2.2.6.RELEASE-tests.jar seal-out/
          ls -l seal-out

      - uses: actions/upload-artifact@v4
        with:
          name: spring-cloud-config-server-jars
          path: seal-out/spring-cloud-config-server-2.2.6.RELEASE*.jar
          if-no-files-found: error

      - name: Test summary (per module, totals, skipped tests with reasons)
        if: always()
        shell: python3 {0}
        run: |
          import glob, os, re
          import xml.etree.ElementTree as ET
          mods = {}
          skips = []
          for f in sorted(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)):
              mod = f.split("/target/")[0]
              r = ET.parse(f).getroot()
              m = mods.setdefault(mod, [0, 0, 0, 0])
              m[0] += int(r.get("tests", 0)); m[1] += int(r.get("failures", 0))
              m[2] += int(r.get("errors", 0)); m[3] += int(r.get("skipped", 0))
              for tc in r.iter("testcase"):
                  sk = tc.find("skipped")
                  if sk is None:
                      continue
                  cls, name = tc.get("classname", ""), tc.get("name", "")
                  reason = (sk.get("message") or "").strip()
                  if not reason:
                      src = glob.glob(f"{mod}/src/test/**/{cls.split('.')[-1]}.java", recursive=True)
                      for s in src:
                          lines = open(s, encoding="utf-8").read().splitlines()
                          for i, l in enumerate(lines):
                              if re.search(r"\b" + re.escape(name) + r"\s*\(", l):
                                  for j in range(max(0, i - 4), i):
                                      if "@Ignore" in lines[j] or "@Disabled" in lines[j]:
                                          reason = "source annotation: " + lines[j].strip()
                                  break
                  skips.append(f"SKIPPED TEST: {cls}.{name} -- reason: {reason or 'class-level @Ignore/assumption'}")
          tot = [0, 0, 0, 0]
          print("=== Surefire results per module ===")
          for mod, (t, fl, e, s) in mods.items():
              print(f"{mod}: Tests run: {t}, Failures: {fl}, Errors: {e}, Skipped: {s}, Passed: {t - fl - e - s}")
              tot = [a + b for a, b in zip(tot, (t, fl, e, s))]
          t, fl, e, s = tot
          print(f"TOTAL: Tests run: {t}, Failures: {fl}, Errors: {e}, Skipped: {s}, Passed: {t - fl - e - s}")
          print("=== Skipped tests ===")
          print("\n".join(skips) if skips else "(none)")
